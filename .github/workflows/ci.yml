name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, such as 0.1.0 (leave empty to only run the tests)
        required: false
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet test tests/Timer.Shared.Tests -c Release
      # A version tag such as v0.1.0, or a manual run with a version, publishes both packages to GitHub Packages.
      - name: Pack and publish
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          dotnet pack src/Timer.Storage -c Release -p:Version="$VERSION" -o out
          dotnet pack src/Timer.Core -c Release -p:Version="$VERSION" -o out
          dotnet nuget push "out/*.nupkg" --source "https://nuget.pkg.github.com/BasicallyGod/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
